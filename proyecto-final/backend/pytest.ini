[pytest]
# Busca tests en todo app/: los archivos test_*.py y los ejemplos (doctest) de los docstrings.
testpaths = app
addopts = --doctest-modules
asyncio_mode = auto
# Aviso interno de una librería externa (starlette), no de nuestro código.
filterwarnings =
    ignore::DeprecationWarning:starlette.testclient
